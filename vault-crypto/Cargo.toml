[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2021"
description = "TermDeck E2EE vault cryptography — the client-side scheme shared by desktop, the vector generator, and (re-implemented against test vectors) Android."

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"   # XChaCha20-Poly1305 AEAD
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base32 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
ureq = "3.3.0"
serde_json = "1"

[[example]]
name = "gen-vectors"
path = "examples/gen_vectors.rs"

# Desktop-side actor for the cross-platform live sync proof (register + push).
[[example]]
name = "desktop-push"
path = "examples/desktop_push.rs"
